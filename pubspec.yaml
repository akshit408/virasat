name: virasat
description: "Virasat - India's AI-Powered Cultural Commerce Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.5.0+1
  http: ^1.2.0
  crypto: ^3.0.3
  url_launcher: ^6.2.5
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3
  intl: ^0.20.2
  flutter_staggered_grid_view: ^0.7.0
  speech_to_text: ^7.5.0
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.1
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/icons/
    - assets/illustrations/
    - assets/images/
    - assets/crafts/
    - assets/states/
    - assets/animations/
    - assets/maps/
    - assets/data/
    - assets/images/sample_crafts/
    - assets/images/crafts/
    - assets/images/states/

